name: Documentation site

# Construit le site MkDocs (docs/ → build/) et le publie sur GitHub Pages.
#
# Mise en service (une seule fois) :
#   1. Settings → Pages → Source = « GitHub Actions » ;
#   2. pousser sur main (ou lancer ce workflow manuellement).
#
# Comportement :
#   - push sur main ou develop  → construit le site ;
#   - push sur main             → publie build/ sur GitHub Pages ;
#   - pull request              → construit seulement (vérification) ;
#   - workflow_dispatch         → construit, puis publie si lancé depuis main.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/build_docs.py'
      - 'scripts/docs_start.sh'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/**'
      - 'requirements-docs.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Construire le site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      - name: Installer MkDocs
        run: pip install -r requirements-docs.txt

      - name: Construire le site (docs/ → build/)
        run: python scripts/build_docs.py --strict

      - name: Vérifier l'artefact
        run: |
          test -f build/index.html
          test -f build/sitemap.xml
          test -f build/search/search_index.json
          echo "pages HTML : $(find build -name '*.html' | wc -l)"

      - name: Configurer GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload de l'artefact Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Publier sur GitHub Pages
    needs: build
    if: |
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      || github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
