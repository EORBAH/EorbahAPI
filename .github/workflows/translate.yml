name: Check translations

# La traduction est faite **en local** (scripts/translate.py + LLM_API_KEY) :
# ce workflow ne traduit pas, il vérifie seulement que les langues déclarées
# dans docs/language_names.yml ont bien toutes leurs pages.
#
# Traduire :
#   LLM_API_KEY=... python scripts/translate.py --lang en
#   python scripts/build_docs.py --strict
#
# Le contrôle ci-dessous est informatif (continue-on-error) : une page non
# traduite n'empêche pas de fusionner, mais le résumé du job le signale.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'scripts/translate.py'
      - 'scripts/prompts/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/translate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Vérifier docs/fr → docs/<lang>
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier les traductions (sans clé API)
        continue-on-error: true
        run: |
          python scripts/translate.py --lang all --check || true
          python scripts/translate.py --lang all --check >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: Rappel
        run: |
          echo "Traduction locale : LLM_API_KEY=... python scripts/translate.py --lang en"
