<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation - EorbahAPI</title>

  <!-- Thème (tu peux en changer : vue, buble, dark, etc.) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">

  <!-- Styles personnalisés (optionnel) -->
  <style>
    :root {
      --theme-color: #000000;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: "EorbahDB",
      repo: "https://github.com/EORBAH/EorbahAPI", // lien GitHub optionnel
      homepage: "Index.md",
      loadSidebar: true,        // active le menu latéral
      loadNavbar: true,         // menu haut optionnel
      coverpage: true,          // page de couverture optionnelle
      auto2top: true,           // retour en haut au changement de page
      themeColor: "#3f51b5",
      search: {
        placeholder: "Rechercher...",
        noData: "Aucun résultat"
      }
    }
  </script>

  <!-- Core Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Plugins utiles (recommandés) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/emoji.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
