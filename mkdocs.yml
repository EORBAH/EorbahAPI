site_name: EorbahAPI
site_description: Framework web PHP moderne pour construire des API — cours complet
site_url: https://eorbah.github.io/EorbahAPI/
repo_url: https://github.com/EORBAH/EorbahAPI
repo_name: EORBAH/EorbahAPI
docs_dir: docs

# Fichiers de travail qui ne doivent pas être publiés :
# - language_names.yml : langues utilisées par scripts/translate.py ;
# - .manifest.json : empreintes des traductions (docs/<lang>/.manifest.json).
exclude_docs: |
  language_names.yml
  **/.manifest.json
edit_uri: edit/develop/docs/

theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          name: Français
          default: true
        - locale: en
          name: English
          nav_translations:
            Accueil: Home
            Installation: Installation
            Premiers pas: First steps
            Guide du cours: Course guide
            Routage: Routing
            Paramètres de chemin: Path parameters
            Paramètres de requête: Query parameters
            Validations: Validations
            Corps de requête: Request body
            Modèles imbriqués: Nested models
            Formulaires: Forms
            Fichiers: Files
            En-têtes: Headers
            Cookies: Cookies
            Réponses: Responses
            Aller plus loin: Going further
            Dépendances: Dependencies
            Sécurité: Security
            Middlewares: Middlewares
            Contrôleurs: Controllers
            Fichiers statiques: Static files
            Templates Twig: Twig templates
            Gestion des erreurs: Error handling
            JSON-RPC: JSON-RPC
            Tests: Testing
            Runners personnalisés: Custom runners
            Référence API: API reference
            Notes de version: Release notes
            Journal des modifications: Changelog

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Accueil: index.md
  - Installation: installation.md
  - Premiers pas: first-steps.md
  - Guide du cours:
      - Routage: routing.md
      - Paramètres de chemin: path-params.md
      - Paramètres de requête: query-params.md
      - Validations: validations.md
      - Corps de requête: request-body.md
      - Modèles imbriqués: nested-models.md
      - Formulaires: forms.md
      - Fichiers: files.md
      - En-têtes: headers.md
      - Cookies: cookies.md
      - Réponses: responses.md
  - Aller plus loin:
      - Dépendances: dependencies.md
      - Sécurité: security.md
      - Middlewares: middlewares.md
      - Contrôleurs: controllers.md
      - Fichiers statiques: static-files.md
      - Templates Twig: templates.md
      - Gestion des erreurs: errors.md
      - JSON-RPC: rpc.md
      - Tests: testing.md
      - Runners personnalisés: runners.md
  - Référence API: reference.md
  - Notes de version:
      - Journal des modifications: release-notes/changelog.md
      - v0.1.0-beta: release-notes/v.0.1.0-beta.md
      - v0.1.0: release-notes/v.0.1.0.md
      - v0.1.1: release-notes/v.0.1.1.md

extra:
  social:
  - icon: octicons/mark-github-24
    link: https://github.com/EORBAH/EorbahAPI
  - icon: fontawesome/brands/x-twitter
    link: https://x.com/eor_bah545
